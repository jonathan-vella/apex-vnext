# Dependabot configuration for automated dependency updates.
#
# Scope: GitHub Actions and root npm dependencies.
# Repository Python test tools are installed by the WSL setup workflow.
#
# Update cadence is weekly to balance freshness with PR noise. Open PR limit
# is conservative (3 per ecosystem) to avoid review-queue overload.
#
# Reference: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # ─── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      # Bundle minor/patch bumps of first-party actions (actions/*) to keep
      # PR volume manageable; security/major bumps still PR individually.
      actions-minor:
        patterns:
          - "actions/*"
        update-types:
          - "minor"
          - "patch"

  # ─── npm: repo root (validators, lint tooling) ─────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "npm"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
