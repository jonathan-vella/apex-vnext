# Branch Naming & Scope Enforcement
# Validates branch naming convention and file scope on PRs

name: Branch Enforcement

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Branch Policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: bash tools/scripts/validate-branch-naming.sh

      - name: Validate branch scope
        env:
          BRANCH: ${{ github.head_ref }}
          BRANCH_SCOPE_STRICT: "true"
        run: bash tools/scripts/validate-branch-scope.sh
