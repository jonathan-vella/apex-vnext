# CI Workflow
# Single required status check for all PRs to main
# Consolidates: lint, agent-validation, policy-compliance-check
# Runs markdown linting + all Node.js validators + handoff validation

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/*]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: ./.github/actions/setup-node-repo

      - name: Setup Python validation
        uses: ./.github/actions/setup-python-validation

      - name: Install bats
        run: sudo apt-get install -y bats

      - name: Lint Markdown
        run: npm run lint:md

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint Python (ruff)
        run: npm run lint:python

      - name: Test Python
        run: npm run test:python

      - name: Build vNext and run Node.js validators (CI-safe)
        run: npm run validate:_node-ci

      - name: Run hook tests
        run: npm run test:hooks

      - name: Qualify APEX vNext
        run: npm run qualify:vnext
