# CI Workflow
# Single required status check for all PRs to main
# Consolidates: lint, agent-validation, policy-compliance-check
# Runs markdown linting + all Node.js validators + handoff validation, then installs the agent plugin
# with a pinned Copilot CLI and smoke-tests the installed MCP server (no Copilot sign-in or secret)
# Skips the "Qualify APEX vNext" and plugin install steps, and the Windows package test shards, for PRs whose changes
# are entirely under docs/ or are the root contributor documents (README, CONTRIBUTING, CONTRIBUTORS, SECURITY)
# (push and workflow_dispatch runs always run the full qualification)

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/*]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether a pull request only changes documentation. The required `ci` job repeats this check itself so a
  # failure here can never turn a required check into a skipped (passing) one; only the optional Windows job waits for it.
  scope:
    name: scope
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect docs-only pull request
        id: scope
        if: github.event_name == 'pull_request'
        run: |
          changed_files="$(git diff --name-only HEAD^1 HEAD)"
          if [ -n "$changed_files" ] && printf '%s\n' "$changed_files" | awk '!/^docs\// && !/^(README|CONTRIBUTING|CONTRIBUTORS|SECURITY)\.md$/ { found = 1 } END { exit found }'; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect docs-only pull request
        id: scope
        if: github.event_name == 'pull_request'
        run: |
          changed_files="$(git diff --name-only HEAD^1 HEAD)"
          if [ -n "$changed_files" ] && printf '%s\n' "$changed_files" | awk '!/^docs\// && !/^(README|CONTRIBUTING|CONTRIBUTORS|SECURITY)\.md$/ { found = 1 } END { exit found }'; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: ./.github/actions/setup-node-repo

      - name: Setup Python validation
        uses: ./.github/actions/setup-python-validation

      - name: Install bats
        run: sudo apt-get install -y bats

      - name: Lint Markdown
        run: npm run lint:md

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint Python (ruff)
        run: npm run lint:python

      - name: Test Python
        run: npm run test:python

      - name: Build vNext and run Node.js validators (CI-safe)
        run: npm run validate:_node-ci

      - name: Run hook tests
        run: npm run test:hooks

      - name: Qualify APEX vNext
        if: steps.scope.outputs.docs_only != 'true'
        run: npm run qualify:vnext

      # Exact pin: bump deliberately. Local-path installs need no Copilot sign-in, token or secret.
      - name: Install the Copilot CLI
        if: steps.scope.outputs.docs_only != 'true'
        run: npm install --global --ignore-scripts @github/copilot@1.0.93

      - name: Install the agent plugin with the Copilot CLI and smoke-test its MCP server
        if: steps.scope.outputs.docs_only != 'true'
        run: npm run test:plugin-install -- --cli-version 1.0.93

  # The kernel, capabilities and CLI package tests (plus the plugin package tests) split across parallel Windows
  # shards. `core` runs the kernel, capabilities and plugin suites whole. The `cli-<i>-of-8` shards each run the 1/8th
  # of every CLI test file selected by APEX_TEST_SHARD (packages/cli/src/test/test-shard.ts), because a few CLI test
  # files hold most of the runtime and cannot be split by file. The `windows-package-tests` job below aggregates them.
  windows-package-shards:
    name: windows-2025 shard (${{ matrix.suite }})
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: core
          - suite: cli-1-of-8
            cli_shard: 1/8
          - suite: cli-2-of-8
            cli_shard: 2/8
          - suite: cli-3-of-8
            cli_shard: 3/8
          - suite: cli-4-of-8
            cli_shard: 4/8
          - suite: cli-5-of-8
            cli_shard: 5/8
          - suite: cli-6-of-8
            cli_shard: 6/8
          - suite: cli-7-of-8
            cli_shard: 7/8
          - suite: cli-8-of-8
            cli_shard: 8/8
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: ./.github/actions/setup-node-repo

      - name: Prepare CLI assets
        shell: bash
        run: npm run prepare:assets --workspace @apexops/cli

      - name: Build kernel, capabilities and CLI
        shell: bash
        run: |
          npm run build --workspace @apexops/kernel
          npm run build --workspace @apexops/capabilities
          npm run build --workspace @apexops/cli

      - name: Test kernel and capabilities
        if: matrix.suite == 'core'
        shell: bash
        run: |
          (cd packages/kernel && node --test dist/test/*.test.js)
          (cd packages/capabilities && node --test dist/test/*.test.js)

      - name: Test CLI shard
        if: matrix.suite != 'core'
        shell: bash
        env:
          APEX_TEST_SHARD: ${{ matrix.cli_shard }}
        run: (cd packages/cli && node --test dist/test/*.test.js)

      - name: Build and test the agent plugin package
        if: matrix.suite == 'core'
        shell: bash
        run: npm run test:plugin

  # The stable `windows-2025 package tests` status check: passes for a docs-only pull request (the shards are
  # skipped) or when the scope job and every shard succeeded; any failed or cancelled shard fails it.
  windows-package-tests:
    name: windows-2025 package tests
    needs: [scope, windows-package-shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require the scope decision and every Windows shard
        env:
          DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          SHARDS_RESULT: ${{ needs.windows-package-shards.result }}
        run: |
          if [ "$SCOPE_RESULT" != "success" ]; then
            echo "The scope job finished as '$SCOPE_RESULT'."
            exit 1
          fi
          if [ "$DOCS_ONLY" = "true" ]; then
            echo "Documentation-only change: the Windows shards were skipped."
            exit 0
          fi
          if [ "$SHARDS_RESULT" != "success" ]; then
            echo "The Windows shards finished as '$SHARDS_RESULT'."
            exit 1
          fi
          echo "Every Windows shard passed."
