# CI Workflow
# Single required status check for all PRs to main
# Consolidates: lint, agent-validation, policy-compliance-check
# Runs markdown linting + all Node.js validators + handoff validation, then installs the agent plugin
# with a pinned Copilot CLI and smoke-tests the installed MCP server (no Copilot sign-in or secret)
# Skips the "Qualify APEX vNext" and plugin install steps for PRs whose changes are entirely under docs/
# (push and workflow_dispatch runs always run the full qualification)

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/*]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect docs-only pull request
        id: scope
        if: github.event_name == 'pull_request'
        run: |
          changed_files="$(git diff --name-only HEAD^1 HEAD)"
          if [ -n "$changed_files" ] && printf '%s\n' "$changed_files" | awk '!/^docs\// { found = 1 } END { exit found }'; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: ./.github/actions/setup-node-repo

      - name: Setup Python validation
        uses: ./.github/actions/setup-python-validation

      - name: Install bats
        run: sudo apt-get install -y bats

      - name: Lint Markdown
        run: npm run lint:md

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint Python (ruff)
        run: npm run lint:python

      - name: Test Python
        run: npm run test:python

      - name: Build vNext and run Node.js validators (CI-safe)
        run: npm run validate:_node-ci

      - name: Run hook tests
        run: npm run test:hooks

      - name: Qualify APEX vNext
        if: steps.scope.outputs.docs_only != 'true'
        run: npm run qualify:vnext

      # Exact pin: bump deliberately. Local-path installs need no Copilot sign-in, token or secret.
      - name: Install the Copilot CLI
        if: steps.scope.outputs.docs_only != 'true'
        run: npm install --global --ignore-scripts @github/copilot@1.0.93

      - name: Install the agent plugin with the Copilot CLI and smoke-test its MCP server
        if: steps.scope.outputs.docs_only != 'true'
        run: npm run test:plugin-install -- --cli-version 1.0.93

  windows-package-tests:
    name: windows-2025 package tests
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: ./.github/actions/setup-node-repo

      - name: Prepare CLI assets
        shell: bash
        run: npm run prepare:assets --workspace @apexops/cli

      - name: Build kernel, capabilities and CLI
        shell: bash
        run: |
          npm run build --workspace @apexops/kernel
          npm run build --workspace @apexops/capabilities
          npm run build --workspace @apexops/cli

      - name: Test kernel, capabilities and CLI
        shell: bash
        run: |
          (cd packages/kernel && node --test dist/test/*.test.js)
          (cd packages/capabilities && node --test dist/test/*.test.js)
          (cd packages/cli && node --test dist/test/*.test.js)

      - name: Build and test the agent plugin package
        shell: bash
        run: npm run test:plugin
