# Composite action: shared Python validation environment.
# Callers must check out the repository first so this local action can be resolved.

name: Setup Python Validation
description: Install pinned Python 3.14 repository validation dependencies

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
      with:
        python-version: "3.14"
        cache: pip

    - name: Install Python validation dependencies
      shell: bash
      run: |
        python -m pip install --require-hashes --only-binary=:all: -r .github/python-validation-requirements.txt
