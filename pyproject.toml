[tool.ruff]
exclude = [
    "infra/",
    "node_modules/",
    ".git/",
    "__pycache__/",
    "*.egg-info/",
    ".venv/",
]

line-length = 120
target-version = "py314"

[tool.ruff.lint]
# Enable common rule sets
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]

ignore = [
    "E501",   # Line length is owned by the formatter.
    "SIM108", # Explicit branches are clearer in validation code.
]

[tool.ruff.lint.isort]
known-first-party = ["mcp", "scripts", "apex_recall"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
