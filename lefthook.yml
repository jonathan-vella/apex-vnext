# lefthook.yml - Git hooks configuration
# Replaces Husky with a faster, dependency-free alternative
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    markdown-lint:
      glob: "*.md"
      run: bash tools/scripts/hooks/markdown-lint.sh
    link-check:
      glob: "docs/{tutorials,how-to,explanation,reference}/**/*.md"
      run: bash tools/scripts/hooks/link-check.sh

    h2-sync:
      glob: "{customizations/.github/skills/apex-artifacts/templates/requirements.md,customizations/manifest.json,packages/renderers/src/document-registry.ts,tools/scripts/validate-artifacts.mjs,tools/tests/validate-artifacts.test.mjs}"
      run: bash tools/scripts/hooks/h2-sync.sh
      fail_text: |
        ❌ Current document-source validation failed!

        Sources must match the current renderer registry and managed requirements template.
        🔧 Run: npm run validate:artifacts

    artifact-validation:
      glob: "{agent-output/**/*.md,customizations/.github/skills/apex-artifacts/templates/requirements.md,customizations/manifest.json,packages/renderers/src/document-registry.ts,tools/scripts/validate-artifacts.mjs,tools/tests/validate-artifacts.test.mjs}"
      run: bash tools/scripts/hooks/artifact-validation.sh
      fail_text: |
        ❌ Current artifact source or challenger-review presence check failed!

        📚 References:
        - customizations/.github/instructions/apex-artifact-contracts.instructions.md
        - config/workflow.v1.json (mandatory review dependencies)
        🔧 Validate source: npm run validate:artifacts
        🔧 Review: run the kernel-issued rubber-duck review, then apex/reviewComplete

    agents:
      glob: "customizations/.github/agents/**/*.agent.md,.github/prompts/**/*.prompt.md"
      run: bash tools/scripts/hooks/agents.sh
      fail_text: |
        ❌ Agent validation failed!

        Checks: frontmatter syntax, no model pins, body size (<500 lines),
        language density (<5 absolute terms per 100 lines),
        managed role and hidden-worker contracts
        📚 Reference: customizations/.github/instructions/apex-agent-authoring.instructions.md

    instructions:
      glob: "**/*.instructions.md,{.github/skills/**,.github/instructions/**}"
      run: bash tools/scripts/hooks/instructions.sh
      fail_text: |
        ❌ Instruction validation failed!

        Checks: frontmatter syntax (description, applyTo only), cross-reference integrity
        📚 Run: npm run validate:instruction-checks

    skill-references:
      # Catch missing canary markers (`<!-- ref:{slug}-v1 -->`) on skill
      # references/*.md before they reach main. CI runs the same validator
      # globally; this hook gives same-PR feedback when a new reference
      # file is added.
      glob: ".github/skills/*/references/*.md,.github/skills/*/SKILL.md"
      run: bash tools/scripts/hooks/skill-references.sh
      fail_text: |
        ❌ Skill-references validation failed!

        Every `.github/skills/*/references/*.md` must start with
        `<!-- ref:{slug}-v1 -->` on the first non-blank line so
        docs-freshness can detect stale references.
        🔧 Run: npm run validate:skill-checks

    secrets-baseline:
      run: bash tools/scripts/hooks/secrets-baseline.sh
      fail_text: |
        ❌ Secrets detected in staged files!
        🔧 Remove secrets before committing. See AGENTS.md for gitleaks setup.

    terraform-fmt:
      glob: "*.tf"
      run: bash tools/scripts/hooks/terraform-fmt.sh

    terraform-validate:
      glob: "*.tf"
      run: bash tools/scripts/hooks/terraform-validate.sh

    iac-security-baseline:
      glob: "{infra/bicep/**/*.bicep,infra/terraform/**/*.tf}"
      run: bash tools/scripts/hooks/iac-security-baseline.sh
      fail_text: |
        ❌ IaC security baseline violation!

        🔧 Fix: TLS 1.2+, HTTPS-only, no public blob access, managed identity
        📚 Reference: AGENTS.md Security Baseline section

    js-lint:
      glob: "**/*.{js,mjs,cjs}"
      run: bash tools/scripts/hooks/js-lint.sh
      fail_text: |
        ❌ ESLint failed!

        🔧 Fix: npm run lint:js -- --fix <files>
        📚 Reference: eslint.config.mjs

    js-format:
      glob: "**/*.{js,mjs,cjs}"
      run: bash tools/scripts/hooks/js-format.sh
      fail_text: |
        ❌ Prettier check failed!

        🔧 Fix: npm run format

commit-msg:
  commands:
    commitlint:
      run: npx --no -- commitlint --edit {1}
      fail_text: |
        ❌ Commit message validation failed!

        📖 Conventional Commits format required:
           <type>[optional scope]: <description>

           Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert

           Examples:
             feat: add new Azure App Service module
             fix(bicep): correct storage account naming
             docs: update README with deployment steps

# Diff-based pre-push validation — runs only matching domain validators in parallel
pre-push:
  parallel: true
  commands:
    branch-naming:
      run: bash tools/scripts/validate-branch-naming.sh
      fail_text: |
        ❌ Branch naming convention violated!

        🔧 Rename your branch using an approved prefix:
           docs/, agents/, skills/, infra/, tools/scripts/, instructions/,
           fix/, feat/, chore/, ci/, refactor/, perf/, test/, build/, revert/

    branch-scope:
      run: bash tools/scripts/validate-branch-scope.sh
      fail_text: |
        ❌ Branch scope violation!

        Domain-scoped branches (docs/, agents/, skills/, etc.) should only
        modify files within their domain. Use feat/ or fix/ for cross-cutting changes.

    diff-based-check:
      run: bash tools/scripts/diff-based-push-check.sh
      fail_text: |
        ❌ Pre-push validation failed!

        🔧 Run the failing validator manually to see details.
        Only validators for changed file types were executed.
