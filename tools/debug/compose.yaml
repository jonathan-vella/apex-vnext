name: apex-insights-dev

services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.156.0
    user: "${APEX_DEBUG_UID:-1000}:${APEX_DEBUG_GID:-1000}"
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "127.0.0.1:${APEX_DEBUG_HTTP_PORT:-4318}:4318"
    env_file:
      - path: .local/collector.env
        format: raw
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - ./.local/queue:/var/lib/otelcol
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
